<style>
/* Layout: an operations console. Fixed rail of sections on the left, one working surface on the right; collapses to a top bar on phones. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --sunk: #eaeef4; --line: #d9dfe8; --ink: #17202e; --muted: #5b6678;
  --accent: #2448c9; --accent-ink: #ffffff; --accent-soft: #e4eafc;
  --good: #17784a; --good-soft: #dcf2e6; --warn: #9a5a00; --warn-soft: #fbedd2; --bad: #b42335; --bad-soft: #fbe0e3;
  --display: "Sora", "IBM Plex Sans", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151e; --panel: #171e2a; --sunk: #1d2533; --line: #2b3546; --ink: #e6ebf3; --muted: #9aa6b8;
  --accent: #7d9bff; --accent-ink: #0d1424; --accent-soft: #22305a;
  --good: #5fd39a; --good-soft: #163527; --warn: #f0b75a; --warn-soft: #3a2c12; --bad: #ff8a98; --bad-soft: #3d1b22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151e; --panel: #171e2a; --sunk: #1d2533; --line: #2b3546; --ink: #e6ebf3; --muted: #9aa6b8;
  --accent: #7d9bff; --accent-ink: #0d1424; --accent-soft: #22305a;
  --good: #5fd39a; --good-soft: #163527; --warn: #f0b75a; --warn-soft: #3a2c12; --bad: #ff8a98; --bad-soft: #3d1b22; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font: 600 17px/1.2 var(--display); padding: 4px 10px 14px; display: flex; gap: 8px; align-items: center }
.brand i { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 13px var(--display); font-style: normal }
.rail a { color: var(--ink); text-decoration: none; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px }
.rail a:hover { background: var(--sunk) }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.rail .n { font: 500 12px var(--mono); background: var(--sunk); border-radius: 10px; padding: 0 7px; color: var(--muted) }
.rail .who { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 10px; border-top: 1px solid var(--line) }
.rail select { font: inherit; margin-top: 4px; width: 100%; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink) }
main { padding-block: 22px 60px; padding-left: max(16px, 28px); padding-right: max(16px, env(safe-area-inset-right, 0px), 28px); min-width: 0; display: flex; flex-direction: column; gap: 18px; max-width: 1240px }
h1 { font: 600 24px/1.2 var(--display); margin: 0; text-wrap: balance }
h2 { font: 600 15px/1.3 var(--display); margin: 0 }
h3 { font: 600 13px/1.3 var(--body); margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
p { margin: 0 }
.sub { color: var(--muted); max-width: 70ch }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap }
.head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.head > div.row { flex-direction: row; flex-wrap: wrap; gap: 8px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) }
.tiles { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.tile { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px }
.tile b { font: 600 24px/1.2 var(--display); font-variant-numeric: tabular-nums }
.tile span { color: var(--muted); font-size: 12.5px }
.btn { font: 500 13.5px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap }
.btn:hover { background: var(--sunk) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--bad) }
.btn:disabled { opacity: .5; cursor: not-allowed }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
thead th { font: 600 11.5px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--sunk); white-space: nowrap }
tbody tr:last-child td { border-bottom: 0 }
tbody tr.click { cursor: pointer }
tbody tr.click:hover td { background: var(--sunk) }
.num { text-align: right }
.mono { font-family: var(--mono); font-size: 12.5px }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 10px; white-space: nowrap; background: var(--sunk); color: var(--muted) }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.good { background: var(--good-soft); color: var(--good) } .pill.watch { background: var(--warn-soft); color: var(--warn) } .pill.problem { background: var(--bad-soft); color: var(--bad) }
.pill.plain::before { display: none }
.sig { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none }
.sig li { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px }
.sig li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--warn); transform: translateY(-1px) }
.sig li.problem::before { background: var(--bad) }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; min-width: 0 }
label.f span.h { font-weight: 400; color: var(--muted); font-size: 12px }
input, select, textarea { font: 14px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 64px }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) }
.form .wide { grid-column: 1 / -1 }
.checks { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none }
.checks li { display: flex; gap: 8px; align-items: baseline }
.checks li b { width: 16px; flex: none; color: var(--good) }
.checks li.todo b { color: var(--muted) }
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; counter-reset: s }
.steps li { border-top: 3px solid var(--line); padding-top: 6px; font-size: 12.5px; color: var(--muted); counter-increment: s }
.steps li::before { content: counter(s) ". "; font-family: var(--mono) }
.steps li.done { border-color: var(--good); color: var(--ink) }
.steps li.now { border-color: var(--accent); color: var(--ink); font-weight: 600 }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--sunk) }
.bar i { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px }
.issue:last-child { border-bottom: 0 }
.sev { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px }
.sev.blocking { background: var(--bad-soft); color: var(--bad) } .sev.warning { background: var(--warn-soft); color: var(--warn) } .sev.info { background: var(--sunk); color: var(--muted) }
.callout { border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--sunk) }
.callout.warn { background: var(--warn-soft); border-color: transparent }
.callout.good { background: var(--good-soft); border-color: transparent }
.callout.bad { background: var(--bad-soft); border-color: transparent }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.cmp dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 13px }
.cmp dt { color: var(--muted) } .cmp dd { margin: 0; overflow-wrap: anywhere }
.chat { display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; padding-right: 4px }
.msg { max-width: 78ch; padding: 10px 13px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55 }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px }
.msg.ai { align-self: flex-start; background: var(--sunk); border-bottom-left-radius: 3px }
.msg ol, .msg ul { margin: 0; padding-left: 20px }
.looked { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted) }
.looked code { font: 11.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px }
.draft { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--panel); border-radius: 4px; font-size: 13.5px }
.suggest { display: flex; flex-wrap: wrap; gap: 6px }
.toast { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; max-width: min(420px, calc(100vw - 32px)); z-index: 20 }
.sample { font: 500 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 2px 6px }
.timer { font: 500 13px var(--mono); color: var(--good) }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)) }
  .brand { padding: 0 8px 0 0; width: 100% }
  .rail a { padding: 6px 9px }
  .rail .who { margin: 0; border: 0; padding: 4px 0 0; width: 100% }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .grid2, .cmp { grid-template-columns: minmax(0, 1fr) }
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)) }
}
.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
.fcard { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.fcard p { overflow-wrap: anywhere }
details.issue { display: block; padding: 0 }
details.issue summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; cursor: pointer; list-style: none }
details.issue summary::-webkit-details-marker { display: none }
details.issue p { padding: 0 0 8px 0 }
.accs { display: grid; gap: 8px }
.acc { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer }
.acc.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
.acc input { width: auto; margin-top: 3px }
.formpage { display: flex; flex-direction: column; gap: 14px; max-width: 820px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

  PAGES.move = () => {
    const mv = MOVES[state.move], s = byId(mv.studio), st = stepOf(mv), canMove = can("moves");

        ${mv.files.map((f, k) => fileCard(mv, f, k, canMove && !locked)).join("")}` : `<p class="muted">No files yet. Upload the exports from ${esc(i.oldPlatform || "their old system")} (CSV here; Excel and web-page "XLS" are read on the server too), or try the sample exports.</p>`}

  };
  function fileCard(mv, f, k, edit) {
    const fields = f.kind === "ignore" ? [] : Object.keys(FIELDS[f.kind]);
    const used = new Set(Object.values(f.mapping));
    const rows = dataRows(f);
    const open = state.openFile === k;
    return `<div class="fcard"><div class="row between"><div style="min-width:0"><b>${esc(f.name)}</b> <span class="small muted">${f.fmt} · ${rows.length} rows · headers on row ${f.headerRow + 1}</span></div>

      ${f.kind === "ignore" ? `<p class="small muted">Left out of the move.</p>` : `<p class="small">${fields.filter((x) => f.mapping[x] !== undefined).map((x) => `${LABELS[x]} ← <span class="mono">${esc(f.headers[f.mapping[x]])}</span>`).join(" · ")}${f.headers.some((h, i) => h && !used.has(i)) ? ` <span class="muted">· not used: ${f.headers.filter((h, i) => h && !used.has(i)).map(esc).join(", ")}</span>` : ""}</p>`}
      ${open && f.kind !== "ignore" ? `<div class="tblwrap"><table><thead><tr><th>We read</th><th>From column</th><th>First rows</th></tr></thead><tbody>${fields.map((x) => `<tr><td>${LABELS[x]}</td><td><select data-map="${k}:${x}" aria-label="${LABELS[x]} column" ${edit ? "" : "disabled"} style="width:auto;max-width:220px"><option value="">Not in this file</option>${f.headers.map((h, i) => `<option value="${i}" ${f.mapping[x] === i ? "selected" : ""}>${esc(h || `Column ${i + 1}`)}</option>`).join("")}</select></td><td class="small mono">${f.mapping[x] === undefined ? "" : rows.slice(0, 3).map(({ r }) => esc(r[f.mapping[x]] || "—")).join(" · ")}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>`;
  }
  function reportCard(mv) {
    const r = mv.report, a = r.acc, tot = Math.max(1, a.rows), t = r.t;
    const seg = (n, c) => (n ? `<i style="width:${(n / tot) * 100}%;background:${c}"></i>` : "");

      if ($("#revealPw")) $("#revealPw").onclick = () => { $("#pw").innerHTML = `<p class="mono">Login: ${esc(mv.intake.accessLogin || "")} · Password: temp-•••• (shown here in the real tool)</p>`; toast("Viewed. This is in the studio's activity log."); };
      if ($("#useSample")) $("#useSample").onclick = () => { mv.files = sampleFiles(byId(mv.studio)); if (["form", "submitted"].includes(mv.status)) mv.status = "files"; render(); toast("Sample exports added: 5 files read."); };
      if ($("#upFile")) $("#upFile").onchange = (e) => readFiles(e.target.files, mv, (skipped) => { invalidate(mv); if (mv.files.length && ["form", "submitted", "undone"].includes(mv.status)) mv.status = "files"; render(); toast(skipped.length ? `${skipped.join(", ")}: this preview reads CSV only. Excel works in the real tool.` : "Files read."); });
      if ($("#dateOrder")) $("#dateOrder").onchange = (e) => { mv.dateOrder = e.target.value || null; invalidate(mv); render(); toast("Saved. Run the check again."); };
      document.querySelectorAll("[data-kind]").forEach((sel) => (sel.onchange = () => { const f = mv.files[sel.dataset.kind]; f.kind = sel.value; f.mapping = mapHeaders(f.kind, f.headers); invalidate(mv); render(); toast("Saved. Run the check again."); }));
      document.querySelectorAll("[data-map]").forEach((sel) => (sel.onchange = () => { const [k, field] = sel.dataset.map.split(":"); const f = mv.files[k]; for (const [x, c] of Object.entries(f.mapping)) if (String(c) === sel.value) delete f.mapping[x]; if (sel.value === "") delete f.mapping[field]; else f.mapping[field] = Number(sel.value); invalidate(mv); render(); }));
      document.querySelectorAll("[data-toggle]").forEach((b) => (b.onclick = () => { const k = Number(b.dataset.toggle); state.openFile = state.openFile === k ? null : k; render(); }));
      document.querySelectorAll("[data-remove]").forEach((b) => (b.onclick = () => { mv.files.splice(Number(b.dataset.remove), 1); invalidate(mv); render(); toast("File removed."); }));
      if ($("#runCheck")) $("#runCheck").onclick = () => { mv.report = runCheck(mv); mv.status = mv.report.ready ? "checked" : "files"; state.askImport = false; render(); $("#report")?.scrollIntoView({ block: "start" }); toast(mv.report.ready ? `Check done: ready to import, ${mv.report.warnings} warnings.` : "Check done: fix the blocking problems first."); };
      if ($("#import")) $("#import").onclick = () => { const r = mv.report; if (!r.warnings && r.reconciliation.every((x) => x.ok)) return doImport(mv); state.askImport = true; render(); $("#importAsk")?.scrollIntoView({ block: "center" }); };
      if ($("#importNo")) $("#importNo").onclick = () => { state.askImport = false; render(); };
      if ($("#importYes")) $("#importYes").onclick = () => doImport(mv);
      if ($("#undo")) $("#undo").onclick = () => { mv.status = "undone"; mv.report = null; mv.ok = {}; byId(mv.studio).clients = 0; render(); toast("Import undone: everything it added was removed."); };
      document.querySelectorAll("[data-ok]").forEach((c) => (c.onchange = () => { mv.ok = { ...(mv.ok || {}), [c.dataset.ok]: c.checked }; render(); }));
      if ($("#reshuffle")) $("#reshuffle").onclick = () => { mv.shuffle = (mv.shuffle || 0) + 1; mv.ok = {}; render(); };
      if ($("#verify")) $("#verify").onclick = () => { mv.status = "verified"; render(); toast("Verified. The old rows are deleted in 30 days."); };
    }
    if (page === "form") {
      const mv = MOVES[state.move], i = mv.intake;
      const read = () => { const v = (id) => $(id)?.value ?? ""; Object.assign(i, { oldPlatform: v("#fPlatform"), switchDate: v("#fDate"), activeClients: v("#fClients") === "" ? undefined : Number(v("#fClients")), activeMemberships: v("#fMembers") === "" ? undefined : Number(v("#fMembers")), activePackages: v("#fPacks") === "" ? undefined : Number(v("#fPacks")), dateFormat: v("#fDates"), packagesSold: v("#fSold"), contactName: v("#fContact"), contactPhone: v("#fPhone"), consent: !!$("#fConsent")?.checked }); if ($("#fLogin")) i.accessLogin = v("#fLogin"); if ($("#fPass")?.value) mv.passwordSaved = true; };
      document.querySelectorAll(".formpage input:not([type=file]):not([type=radio]), .formpage select, .formpage textarea").forEach((el) => { el.addEventListener("input", read); el.addEventListener("change", read); });
      $("#fPlatform").addEventListener("change", () => render());
      document.querySelectorAll('input[name="mvAccess"]').forEach((r) => r.addEventListener("change", () => { read(); i.access = r.value; render(); }));
      $("#fFile").onchange = (e) => readFiles(e.target.files, mv, (skipped) => { render(); toast(skipped.length ? `${skipped.join(", ")}: this preview reads CSV only.` : "Files added."); });
      if ($("#fSave")) $("#fSave").onclick = () => { read(); toast("Saved. Come back to the link any time to finish."); };
      if ($("#fEdit")) $("#fEdit").onclick = () => { state.editForm = true; render(); };
      if ($("#fSend")) $("#fSend").onclick = () => {
        read();
        const missing = [!i.oldPlatform && "which system you use now", !i.switchDate && "when you'd like to switch", !i.access && "how we get your data", i.access === "password" && !i.accessLogin && "the login to use", i.access === "password" && !mv.passwordSaved && "the temporary password", !i.consent && "your OK for us to move your clients' details"].filter(Boolean);
        if (missing.length) { $("#fErr").textContent = `Before sending, add ${missing.join(", ")}.`; return; }
        mv.form.submittedAt ||= "today"; state.editForm = false;
        mv.dateOrder = ["dmy", "mdy"].includes(i.dateFormat) ? i.dateFormat : mv.dateOrder;
        if (mv.status === "form") mv.status = mv.files.length ? "files" : "submitted";
        render(); toast("Sent to our team.");
      };
    }
    if (page === "assistant") {
      document.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => ask(b.dataset.q)));
      $("#askForm").onsubmit = (e) => { e.preventDefault(); const t = $("#askText").value.trim(); if (t) ask(t); };
      if ($("#newChat")) $("#newChat").onclick = () => { state.chat = []; render(); };
    }
  }
  function doImport(mv) { mv.status = "imported"; state.askImport = false; const t = mv.report.t; byId(mv.studio).clients = t.clientsNew + t.clientsLinked; render(); toast(`Imported: ${t.clientsNew + t.clientsLinked} clients, ${t.packs} packs, ${t.members} memberships, ${t.bookings} bookings.`); }
  $("#asRole").onchange = (e) => { state.role = e.target.value; render(); toast(`Viewing as ${e.target.selectedOptions[0].text}.`); };
  window.addEventListener("hashchange", render);
  render();
  window.__hq = { state, MOVES, STUDIOS, runCheck };
})();
</script>
