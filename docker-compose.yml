# Local development database. Production uses a managed Postgres (see docs/HOSTING_AND_DEPLOYMENT.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
