# Render Blueprint: the API, its background worker and the Postgres database (Singapore), and the
# marketing site with the free trial page. How to use it: docs/DEPLOY_RENDER.md.
#
# Our addresses: skedoo.io (the site, with www) and api.skedoo.io (the API), as custom domains on
# studio-site and studio-api. Render's own addresses (studio-site-tkib.onrender.com and
# studio-api-td8z.onrender.com) keep working; the plain studio-api / studio-site names belong to
# another Render account. These values are applied on every sync, so change them here, not in the
# dashboard: PUBLIC_API_URL and CORS_ORIGINS (the API) and SITE_API_URL (the site) must be ours, or
# the site would talk to someone else's server.

databases:
  - name: studio-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: studio
    user: studio
    # No outside connections: only our own Render services can reach the database.
    ipAllowList: []

envVarGroups:
  - name: studio-api-settings
    envVars:
      - key: NODE_ENV
        value: production
      # Sign-in: only tokens from our Supabase project, made for this app, are accepted.
      - key: AUTH_JWKS_URL
        value: https://lezcugmdxretpofadjio.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_ISSUER
        value: https://lezcugmdxretpofadjio.supabase.co/auth/v1
      - key: AUTH_AUDIENCE
        value: authenticated
      # Render's load balancer sits in front of the API (for rate limits by real address).
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Who the API's own emails come from (they start going out once Postmark is added).
      - key: EMAIL_FROM
        value: Skedoo <hello@skedoo.io>
      - key: PUBLIC_API_URL
        value: https://api.skedoo.io
      # The websites allowed to call the API from a browser (comma-separated).
      - key: CORS_ORIGINS
        value: https://skedoo.io,https://www.skedoo.io,https://studio-site-tkib.onrender.com

services:
  - type: web
    name: studio-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Database changes run before each new version takes traffic; if they fail, the old one stays.
    preDeployCommand: node dist/scripts/migrate.mjs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - fromGroup: studio-api-settings

  - type: worker
    name: studio-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node --enable-source-maps dist/jobs/worker.mjs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - fromGroup: studio-api-settings

  # The marketing site, including the free trial sign-up (free on Render, served from a CDN).
  - type: web
    name: studio-site
    runtime: static
    buildCommand: node apps/site/build.mjs
    staticPublishPath: apps/site/dist
    autoDeploy: true
    envVars:
      - key: SITE_API_URL
        value: https://api.skedoo.io
      - key: SITE_SUPABASE_URL
        value: https://lezcugmdxretpofadjio.supabase.co
      # The project's publishable key (sb_publishable_...). Render asks for it when you create
      # the Blueprint. Never the secret or service-role key: the site's build refuses those.
      - key: SITE_SUPABASE_KEY
        sync: false
