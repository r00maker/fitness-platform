<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Manrope:wght@500..800&display=swap">
<style>
/* The film canvas: 1920x1080, the site's graphite with one steel light. */
:root { --ink: #0e1115; --ink-2: #13171c; --line: #262c34; --fg: #e8ebef; --mute: #8f98a5; --steel: #a6c0dc; --lilac: #d9c9ff; --mint: #9fd8d0 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink) }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(120% 90% at 50% 120%, #161b22 0%, var(--ink) 60%); font-family: "Instrument Sans", sans-serif; color: var(--fg) }
#glow { position: absolute; left: 50%; top: 40%; width: 1500px; height: 1100px; margin: -550px 0 0 -750px; background: radial-gradient(closest-side, rgba(166, 192, 220, .13), transparent 70%); pointer-events: none }
.shot { position: absolute; inset: 0 }
.frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
.frame img { display: block }
.frame.window img { border-radius: 26px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .07), 0 60px 160px -40px rgba(0, 0, 0, .85) }
.frame.phone { padding: 22px; border-radius: 96px; background: #050a09; box-shadow: 0 0 0 3px #2a3431, 0 80px 180px -40px rgba(0, 0, 0, .9) }
.frame.phone img { border-radius: 74px }

/* Captions */
.cap { position: absolute; max-width: 980px; padding: 40px 48px; z-index: 5 }
.cap.bl { left: 56px; bottom: 56px }
.cap.tl { left: 56px; top: 56px }
.cap.br { right: 56px; bottom: 56px; text-align: right }
.cap.tr { right: 56px; top: 56px; text-align: right }
.cap.scrim::before { content: ""; position: absolute; inset: -60px -120px -60px -120px; z-index: -1; background: radial-gradient(closest-side, rgba(14, 17, 21, .92), rgba(14, 17, 21, .75) 55%, transparent); }
.cap-h { font: 700 92px/1.02 "Manrope", sans-serif; letter-spacing: -0.04em }
.cap-l { display: block; overflow: hidden; padding-bottom: .06em }
.cap-i { display: inline-block }
.cap-s { margin-top: 18px; font: 500 34px/1.35 "Instrument Sans", sans-serif; color: #c3cad4; max-width: 30ch }

/* Time stamps */
.title { position: absolute; left: 50%; top: 50%; z-index: 6; font: 800 300px/1 "Manrope", sans-serif; letter-spacing: -0.05em; white-space: nowrap; color: var(--fg); text-shadow: 0 30px 120px rgba(0, 0, 0, .6) }
.title .kicker { position: absolute; left: 50%; top: -40px; transform: translateX(-50%); font: 600 34px/1 "Instrument Sans", sans-serif; letter-spacing: 0; color: var(--steel) }
.chip { position: absolute; left: 56px; top: 52px; z-index: 6; padding: 14px 26px; border-radius: 999px; background: rgba(14, 17, 21, .78); border: 2px solid rgba(166, 192, 220, .5); font: 700 38px/1 "Manrope", sans-serif; letter-spacing: -0.02em; backdrop-filter: blur(10px) }

/* Callouts */
.ring { position: absolute; z-index: 4; border-radius: 22px; border: 4px solid var(--steel); box-shadow: 0 0 0 8px rgba(166, 192, 220, .18), 0 0 60px rgba(166, 192, 220, .35); pointer-events: none }
.tag { position: absolute; z-index: 5; padding: 18px 30px; border-radius: 999px; background: var(--fg); color: var(--ink); font: 700 40px/1 "Manrope", sans-serif; letter-spacing: -0.02em; white-space: nowrap; box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .7) }
.tagline { position: absolute; z-index: 4; background: var(--steel) }

/* End card */
.end { position: absolute; inset: 0; z-index: 7; display: grid; place-content: center; text-align: center; gap: 26px; background: radial-gradient(80% 70% at 50% 50%, rgba(14, 17, 21, .9), var(--ink)) }
.end-h { font: 800 140px/1 "Manrope", sans-serif; letter-spacing: -0.05em; max-width: 14ch; margin: 0 auto; background-image: linear-gradient(90deg, var(--fg) 0, var(--fg) 33.4%, #fff 41%, var(--lilac) 46%, var(--steel) 51%, var(--mint) 56%, rgba(232, 235, 239, .3) 64%, rgba(232, 235, 239, .3) 100%); background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
.end-s { font: 500 40px/1.3 "Instrument Sans", sans-serif; color: #c3cad4 }
</style>
</head>
<body>
<div id="stage"><div id="glow"></div></div>
<script src="../stills/index.js"></script>
<script src="engine.js"></script>
<script src="films.js"></script>
<script>
  // ?film=<name>: build that film; the renderer then calls seek(t) frame by frame.
  const name = new URLSearchParams(location.search).get("film");
  window.FILM_DUR = window.FILMS[name](window.FILM);
  window.seek(0);
</script>
</body>
</html>
